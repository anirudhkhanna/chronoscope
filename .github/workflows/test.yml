name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Skip Playwright's bundled Chromium download — this tool only ever
      # drives real installed Chrome via `channel: 'chrome'`, never bundled
      # Chromium (see CLAUDE.md). ubuntu-latest ships Google Chrome stable.
      - name: Install dependencies
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install

      - name: Verify real Chrome is available
        run: google-chrome --version

      # ubuntu-latest has no display server — any headless: false Chrome
      # launch (--headed/--manual/--devtools/--pause-on-alarm/
      # --new-tab-on-alarm tests) fails outright with "Target page, context
      # or browser has been closed" without one. xvfb-run provides a virtual
      # framebuffer for Chrome to render into; nothing is actually displayed
      # anywhere, it just satisfies Chrome's requirement that a display exist.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run test suite
        run: xvfb-run --auto-servernum npm test
